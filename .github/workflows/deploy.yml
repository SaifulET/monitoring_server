name: Deploy

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Deploy

        uses: appleboy/ssh-action@v1

        with:

          host: ${{ secrets.BASTION_HOST }}

          username: ubuntu

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |

            ssh ubuntu@10.0.2.238 << 'EOF'

            cd ~/monitoring_server

            git pull

            cd backend

            npm install

            pm2 restart backend

            cd ../frontend

            npm install

            npm run build

            pm2 restart frontend

            EOF
